services:
  api:
    container_name: ai-video-api-prod
    build:
      context: .
      dockerfile: apps/api/Dockerfile.prod # Use the PROD Dockerfile
    # Load environment variables from the PROD .env file
    env_file:
      - ./.env.prod
    ports:
      - "80:80" # Map host port 80 (web standard) to container port 80
    depends_on:
      - mongo
    restart: always

  mongo:
    container_name: ai-video-mongo-prod
    image: mongo:6.0 
    # Note: Prod MongoDB should usually NOT expose its port publicly!
    # We expose it here for simplicity, but remove this for real prod.
    ports:
      - "27018:27017" 
    volumes:
      - mongo-prod-data:/data/db
    restart: always

volumes:
  mongo-prod-data:
