services:
  api:
    container_name: ai-video-api-dev
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    env_file:
      - ./.env.dev
    volumes:
      # Mount the entire monorepo root for source code access/hot-reloading
      - ./apps/api/:/app/apps/api
    ports:
      - "3333:3333"
      - "9229:9229"
    depends_on:
      - mongo
  web:
    container_name: ai-video-web-dev
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.dev
    volumes:
      - ./apps/web/:/app/apps/web
    ports:
      - "5173:5173"
    depends_on:
      - api

  mongo:
    container_name: ai-video-mongo-dev
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-dev-data:/data/db

volumes:
  mongo-dev-data:
