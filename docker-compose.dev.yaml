services:
  api:
    container_name: vidiamind-api-dev
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    env_file:
      - ./.env.dev
    volumes:
      - ./apps/api/:/app/apps/api
    ports:
      - "3333:3333"
    environment:
      - WATCHFILES_FORCE_POLLING=true # python hot reload
      - PYTHONPATH=/app/apps/api
    depends_on:
      - mongo
      - ollama

  web:
    container_name: vidiamind-web-dev
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.dev
    volumes:
      - ./apps/web/:/app/apps/web
    ports:
      - "5173:5173"
    depends_on:
      - api

  mongo:
    container_name: vidiamind-mongo-dev
    image: mongodb/mongodb-atlas-local
    hostname: mongo
    env_file:
      - ./.env.dev
    ports:
      - "27017:27017"
    volumes:
      - mongo-dev-data:/data/db
      - mongo-dev-config:/data/configdb

  ollama:
    container_name: vidiamind-ollama
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]
    environment:
      - OLLAMA_NUM_PARALLEL=1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Helper service to automate the model pulls
  ollama-puller:
    image: curlimages/curl:latest
    container_name: vidiamind-ollama-puller
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - "-c"
      - |
        echo "Pulling llama3.1..."
        curl -X POST http://ollama:11434/api/pull -d '{"name": "llama3.1"}'
        echo "Pulling nomic-embed-text..."
        curl -X POST http://ollama:11434/api/pull -d '{"name": "nomic-embed-text"}'
        echo "Models ready!"

volumes:
  mongo-dev-data:
  mongo-dev-config:
  ollama-data:
